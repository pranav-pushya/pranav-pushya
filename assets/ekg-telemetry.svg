<svg viewBox="0 0 960 120" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Live EKG Repository Commit Pulse Monitor">
  <title>Repository Commit Pulse Telemetry</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="ekgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55e5ed" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#55e5ed"/>
      <stop offset="100%" stop-color="#a692ff"/>
    </linearGradient>
    <filter id="ekgGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="119" rx="12" fill="#060a14" stroke="#22324d" stroke-width="1.2"/>
  <text x="20" y="24" font-size="11" font-weight="700" fill="#a692ff" letter-spacing="1">
    ⚡ REPOSITORY PULSE // ECG COMMIT TELEMETRY
  </text>
  <text x="940" y="24" text-anchor="end" font-size="11" font-weight="700" fill="#22c55e">
    ● 30 PUBLIC REPOS · ACTIVE PIPELINE
  </text>

  <line x1="20" y1="74" x2="940" y2="74" stroke="#162236" stroke-dasharray="4 4"/>

  <path id="ekgWave" d="M 20 74 L 140 74 L 160 36 L 180 100 L 200 54 L 220 74 L 360 74 L 380 28 L 400 106 L 420 50 L 440 74 L 590 74 L 615 34 L 635 98 L 655 58 L 675 74 L 810 74 L 830 42 L 850 96 L 870 74 L 940 74"
        fill="none" stroke="url(#ekgGrad)" stroke-width="2.4" filter="url(#ekgGlow)"/>

  <circle r="4.5" fill="#ffffff" stroke="#55e5ed" stroke-width="2" filter="url(#ekgGlow)">
    <animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#ekgWave"/></animateMotion>
  </circle>
</svg>