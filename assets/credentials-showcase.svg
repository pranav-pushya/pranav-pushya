<svg viewBox="0 0 960 400" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Verified Credentials, KPIs, Verification Seals, and Git-Log Milestones">
  <title>Verified Credentials &amp; Hackathon Milestones</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap');
      text { font-family: 'JetBrains Mono', -apple-system, sans-serif; }
    </style>
    <linearGradient id="holoSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#55e5ed" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#a692ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 -1" to="1 1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- 13B: Giant Impact KPI Bar -->
  <g>
    <rect x="0.5" y="0.5" width="228" height="72" rx="10" fill="#090f1d" stroke="#23334d"/>
    <text x="114" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#55e5ed">1</text>
    <text x="114" y="58" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="1">PATENT FILED (VISION AI)</text>

    <rect x="244.5" y="0.5" width="228" height="72" rx="10" fill="#090f1d" stroke="#23334d"/>
    <text x="358" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#a692ff">6+</text>
    <text x="358" y="58" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="1">NATIONAL HACKATHONS</text>

    <rect x="488.5" y="0.5" width="228" height="72" rx="10" fill="#090f1d" stroke="#23334d"/>
    <text x="602" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#22c55e">9+</text>
    <text x="602" y="58" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="1">SHIPPED SYSTEMS</text>

    <rect x="732.5" y="0.5" width="227" height="72" rx="10" fill="#090f1d" stroke="#23334d"/>
    <text x="846" y="38" text-anchor="middle" font-size="26" font-weight="800" fill="#f0f5ff">8.4</text>
    <text x="846" y="58" text-anchor="middle" font-size="10" fill="#94a3b8" letter-spacing="1">CHITKARA CGPA (AI/ML)</text>
  </g>

  <!-- 13A: 4 Digital Verification Seals with Holographic Sheen -->
  <g transform="translate(0, 88)">
    <g>
      <rect x="0.5" y="0.5" width="228" height="96" rx="10" fill="#0b1326" stroke="#eab308" stroke-opacity="0.7"/>
      <rect x="0.5" y="0.5" width="228" height="96" rx="10" fill="url(#holoSheen)"/>
      <circle cx="114" cy="30" r="16" fill="#1a1608" stroke="#eab308" stroke-width="1.5"/>
      <text x="114" y="35" text-anchor="middle" font-size="13" fill="#eab308" font-weight="800">IP</text>
      <text x="114" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f5ff">Patent Filed</text>
      <text x="114" y="82" text-anchor="middle" font-size="9.5" fill="#eab308">Multi-Sensor Waste AI</text>
    </g>

    <g transform="translate(244, 0)">
      <rect x="0.5" y="0.5" width="228" height="96" rx="10" fill="#0b1326" stroke="#0078D4" stroke-opacity="0.8"/>
      <rect x="0.5" y="0.5" width="228" height="96" rx="10" fill="url(#holoSheen)"/>
      <circle cx="114" cy="30" r="16" fill="#071a30" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="114" y="35" text-anchor="middle" font-size="12" fill="#38bdf8" font-weight="800">AZ</text>
      <text x="114" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f5ff">Azure DP-900</text>
      <text x="114" y="82" text-anchor="middle" font-size="9.5" fill="#55e5ed">Microsoft Certified</text>
    </g>

    <g transform="translate(488, 0)">
      <rect x="0.5" y="0.5" width="228" height="96" rx="10" fill="#0b1326" stroke="#55e5ed" stroke-opacity="0.7"/>
      <rect x="0.5" y="0.5" width="228" height="96" rx="10" fill="url(#holoSheen)"/>
      <circle cx="114" cy="30" r="16" fill="#071e24" stroke="#55e5ed" stroke-width="1.5"/>
      <text x="114" y="35" text-anchor="middle" font-size="12" fill="#55e5ed" font-weight="800">ZT</text>
      <text x="114" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f5ff">NexHack &amp; PECathon</text>
      <text x="114" y="82" text-anchor="middle" font-size="9.5" fill="#22c55e">OT/SCADA &amp; PII Defense</text>
    </g>

    <g transform="translate(732, 0)">
      <rect x="0.5" y="0.5" width="227" height="96" rx="10" fill="#0b1326" stroke="#a692ff" stroke-opacity="0.7"/>
      <rect x="0.5" y="0.5" width="227" height="96" rx="10" fill="url(#holoSheen)"/>
      <circle cx="113" cy="30" r="16" fill="#17112b" stroke="#a692ff" stroke-width="1.5"/>
      <text x="113" y="35" text-anchor="middle" font-size="12" fill="#a692ff" font-weight="800">&lt;/&gt;</text>
      <text x="113" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#f0f5ff">Code 2 Chill &amp; Helix</text>
      <text x="113" y="82" text-anchor="middle" font-size="9.5" fill="#a692ff">Tech Mentor &amp; Product Owner</text>
    </g>
  </g>

  <!-- 6A: Git-Log Milestone Feed -->
  <g transform="translate(0, 200)">
    <rect x="0.5" y="0.5" width="959" height="199" rx="12" fill="#060a14" stroke="#22324d"/>
    <rect x="0.5" y="0.5" width="959" height="28" rx="12" fill="#0c1322"/>
    <rect x="0.5" y="18" width="959" height="10" fill="#0c1322"/>
    <line x1="0" y1="28" x2="960" y2="28" stroke="#1b283d"/>
    <text x="18" y="18" font-size="10.5" font-weight="700" fill="#55e5ed">$ git log --graph --oneline --decorate milestones</text>

    <!-- Vertical Branch Line + Flowing Spark -->
    <line x1="28" y1="44" x2="28" y2="184" stroke="#1e2e47" stroke-width="2"/>
    <circle cx="28" cy="44" r="3.5" fill="#55e5ed">
      <animate attributeName="cy" values="44;184;44" dur="5s" repeatCount="indefinite"/>
    </circle>

    <g font-size="11.5">
      <circle cx="28" cy="48" r="4.5" fill="#eab308"/>
      <text x="44" y="52" fill="#eab308" font-weight="700">a8f4c12</text>
      <text x="108" y="52" fill="#f0f5ff"><tspan font-weight="700">Patent Filed:</tspan> Multi-sensor fusion automated waste sorting (SwachhSort AI)</text>
      <text x="942" y="52" text-anchor="end" font-size="10" fill="#eab308">(HEAD -&gt; ip/patent)</text>

      <circle cx="28" cy="75" r="4.5" fill="#55e5ed"/>
      <text x="44" y="79" fill="#55e5ed" font-weight="700">9c21d08</text>
      <text x="108" y="79" fill="#f0f5ff"><tspan font-weight="700">NexHack 2.0 (IITM):</tspan> Zero Trust OT/SCADA water pipeline simulation (TRUSTGRID)</text>
      <text x="942" y="79" text-anchor="end" font-size="10" fill="#55e5ed">(tag: iitm-janakpuri)</text>

      <circle cx="28" cy="102" r="4.5" fill="#a692ff"/>
      <text x="44" y="106" fill="#a692ff" font-weight="700">7b4e920</text>
      <text x="108" y="106" fill="#f0f5ff"><tspan font-weight="700">PECathon 2026 (PEC):</tspan> PrivacyLens client-side PII redaction &amp; local RAG</text>
      <text x="942" y="106" text-anchor="end" font-size="10" fill="#a692ff">(tag: security-track)</text>

      <circle cx="28" cy="129" r="4.5" fill="#22c55e"/>
      <text x="44" y="133" fill="#22c55e" font-weight="700">5f10a33</text>
      <text x="108" y="133" fill="#f0f5ff"><tspan font-weight="700">Hack Helix (TIET):</tspan> Product Owner — CogniFlow MediaPipe fatigue-aware UI</text>
      <text x="942" y="133" text-anchor="end" font-size="10" fill="#22c55e">(tag: thapar-univ)</text>

      <circle cx="28" cy="156" r="4.5" fill="#38bdf8"/>
      <text x="44" y="160" fill="#38bdf8" font-weight="700">3d88e19</text>
      <text x="108" y="160" fill="#f0f5ff"><tspan font-weight="700">Microsoft Certified:</tspan> Azure Data Fundamentals (DP-900) · Code 2 Chill Mentor</text>
      <text x="942" y="160" text-anchor="end" font-size="10" fill="#38bdf8">(tag: certified)</text>

      <circle cx="28" cy="183" r="4.5" fill="#94a3b8"/>
      <text x="44" y="187" fill="#94a3b8" font-weight="700">1e04b77</text>
      <text x="108" y="187" fill="#cbd5e1"><tspan font-weight="700">National Hackathons:</tspan> Adobe Univ Hackathon 2026 · Graviton (CGC) · ET AI</text>
      <text x="942" y="187" text-anchor="end" font-size="10" fill="#64748b">(tag: competitions)</text>
    </g>
  </g>
</svg>