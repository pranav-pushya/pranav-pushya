<svg viewBox="0 0 960 190" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Skill Radar and Active R&amp;D Mastery Meters">
  <title>Skill Radar &amp; Active R&amp;D Progress</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', -apple-system, sans-serif; }
    </style>
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#256675"/><stop offset="100%" stop-color="#55e5ed"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a45b5"/><stop offset="100%" stop-color="#a692ff"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="189" rx="12" fill="#070c17" stroke="#22324d" stroke-width="1.2"/>

  <!-- Left: Pentagonal Skill Radar -->
  <g transform="translate(145, 96)">
    <polygon points="0,-60 57,-19 35,48 -35,48 -57,-19" fill="none" stroke="#1e2d44" stroke-width="1.2"/>
    <polygon points="0,-40 38,-12 23,32 -23,32 -38,-12" fill="none" stroke="#1e2d44" stroke-width="1"/>
    <polygon points="0,-20 19,-6 11,16 -11,16 -19,-6" fill="none" stroke="#1e2d44" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#1a263a"/>
    <line x1="0" y1="0" x2="57" y2="-19" stroke="#1a263a"/>
    <line x1="0" y1="0" x2="35" y2="48" stroke="#1a263a"/>
    <line x1="0" y1="0" x2="-35" y2="48" stroke="#1a263a"/>
    <line x1="0" y1="0" x2="-57" y2="-19" stroke="#1a263a"/>

    <!-- Animated Radar Polygon -->
    <polygon points="0,-54 51,-15 31,42 -28,36 -48,-16" fill="#55e5ed" fill-opacity="0.18" stroke="#55e5ed" stroke-width="2">
      <animate attributeName="fill-opacity" values="0.14;0.28;0.14" dur="3.5s" repeatCount="indefinite"/>
    </polygon>

    <!-- Vertex Pulses -->
    <circle cx="0" cy="-54" r="3.5" fill="#55e5ed"/>
    <circle cx="51" cy="-15" r="3.5" fill="#a692ff"/>
    <circle cx="31" cy="42" r="3.5" fill="#22c55e"/>
    <circle cx="-28" cy="36" r="3.5" fill="#55e5ed"/>
    <circle cx="-48" cy="-16" r="3.5" fill="#eab308"/>

    <!-- Axis Labels -->
    <text x="0" y="-68" text-anchor="middle" font-size="9.5" font-weight="700" fill="#55e5ed">AI / ML</text>
    <text x="78" y="-14" text-anchor="middle" font-size="9.5" font-weight="700" fill="#a692ff">SECURITY</text>
    <text x="52" y="64" text-anchor="middle" font-size="9.5" font-weight="700" fill="#22c55e">BACKEND</text>
    <text x="-52" y="64" text-anchor="middle" font-size="9.5" font-weight="700" fill="#cbd5e1">VISION</text>
    <text x="-78" y="-14" text-anchor="middle" font-size="9.5" font-weight="700" fill="#eab308">DEVOPS</text>
  </g>

  <line x1="285" y1="18" x2="285" y2="172" stroke="#1d2b44" stroke-dasharray="4 4"/>

  <!-- Right: Core Competency & Active R&D Meters -->
  <text x="315" y="34" font-size="11" font-weight="700" fill="#55e5ed" letter-spacing="1.2">
    // PRODUCTION MASTERY &amp; ACTIVE R&amp;D RADAR
  </text>

  <g font-size="11" fill="#e2e8f0">
    <text x="315" y="60">AI SYSTEMS &amp; VISION <tspan fill="#7d8ea6">(Groq · RAG · MediaPipe · PyTorch · OpenCV)</tspan></text>
    <text x="928" y="60" text-anchor="end" fill="#55e5ed" font-weight="700">90%</text>
    <rect x="315" y="68" width="613" height="8" rx="4" fill="#131f33"/>
    <rect x="315" y="68" width="552" height="8" rx="4" fill="url(#barCyan)">
      <animate attributeName="width" from="0" to="552" dur="1.4s" fill="freeze"/>
    </rect>

    <text x="315" y="96">CYBERSECURITY &amp; PRIVACY <tspan fill="#7d8ea6">(Zero Trust · Kali · Client-Side PII Masking)</tspan></text>
    <text x="928" y="96" text-anchor="end" fill="#a692ff" font-weight="700">86%</text>
    <rect x="315" y="104" width="613" height="8" rx="4" fill="#131f33"/>
    <rect x="315" y="104" width="527" height="8" rx="4" fill="url(#barPurple)">
      <animate attributeName="width" from="0" to="527" dur="1.6s" fill="freeze"/>
    </rect>

    <text x="315" y="132">BACKEND &amp; CLOUD <tspan fill="#7d8ea6">(FastAPI · React · Neon · Render · Supabase · Firebase)</tspan></text>
    <text x="928" y="132" text-anchor="end" fill="#22c55e" font-weight="700">92%</text>
    <rect x="315" y="140" width="613" height="8" rx="4" fill="#131f33"/>
    <rect x="315" y="140" width="564" height="8" rx="4" fill="url(#barGreen)">
      <animate attributeName="width" from="0" to="564" dur="1.8s" fill="freeze"/>
    </rect>
  </g>

  <!-- Exploring Footer -->
  <rect x="315" y="158" width="613" height="22" rx="4" fill="#0c1526" stroke="#1e2d44"/>
  <text x="325" y="173" font-size="10" fill="#94a3b8">
    <tspan fill="#eab308" font-weight="700">⚡ LEVELING UP:</tspan> Autonomous AI Agents &amp; MCP · Web App Pentesting &amp; OSINT · Android Overlays
  </text>
</svg>