<svg viewBox="0 0 960 110" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Animated Cyber Signal Wave Footer">
  <title>Understand It. Build It. Iterate.</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="waveGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55e5ed" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a692ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#55e5ed" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a692ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#55e5ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a692ff" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="footClip">
      <rect x="0" y="0" width="960" height="110" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footClip)">
    <rect width="960" height="110" fill="#060a14"/>

    <!-- Rising Data Particles -->
    <circle cx="140" cy="80" r="2.2" fill="#55e5ed" opacity="0.65"><animate attributeName="cy" values="105;12" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="60" r="2.6" fill="#a692ff" opacity="0.6"><animate attributeName="cy" values="105;10" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="70" r="2.2" fill="#55e5ed" opacity="0.7"><animate attributeName="cy" values="105;15" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="50" r="2.4" fill="#f0f5ff" opacity="0.55"><animate attributeName="cy" values="105;12" dur="4.9s" repeatCount="indefinite"/></circle>

    <!-- Morphing Cyber Sine Waves -->
    <path d="M0,58 C240,25 380,90 600,52 C760,26 860,78 960,48 L960,110 L0,110 Z" fill="url(#waveGrad1)">
      <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
               values="M0,58 C240,25 380,90 600,52 C760,26 860,78 960,48 L960,110 L0,110 Z;
                       M0,48 C240,86 380,28 600,66 C760,88 860,34 960,58 L960,110 L0,110 Z;
                       M0,58 C240,25 380,90 600,52 C760,26 860,78 960,48 L960,110 L0,110 Z"/>
    </path>

    <path d="M0,72 C210,96 410,42 630,76 C790,94 870,52 960,72 L960,110 L0,110 Z" fill="url(#waveGrad2)">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
               values="M0,72 C210,96 410,42 630,76 C790,94 870,52 960,72 L960,110 L0,110 Z;
                       M0,66 C210,42 410,94 630,62 C790,46 870,88 960,64 L960,110 L0,110 Z;
                       M0,72 C210,96 410,42 630,76 C790,94 870,52 960,72 L960,110 L0,110 Z"/>
    </path>

    <text x="480" y="92" text-anchor="middle" font-size="11.5" font-weight="700" fill="#f0f5ff" letter-spacing="2.4">
      UNDERSTAND IT · BUILD IT · ITERATE
    </text>
  </g>
  <rect x="0.5" y="0.5" width="959" height="109" rx="13.5" fill="none" stroke="#22324d" stroke-width="1"/>
</svg>