<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">Pranav Pushya — Build. Understand. Iterate.</title>
<desc id="desc">An animated engineering lab with orbiting signals. CSE AI/ML at Chitkara. Computer vision, cybersecurity, and developer tools.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1326"/><stop offset="1" stop-color="#090b14"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#55e5ed"/><stop offset="1" stop-color="#a692ff"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7160dd" stop-opacity=".22"/><stop offset="1" stop-color="#7160dd" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#51658b" stroke-opacity=".12"/></pattern>
<clipPath id="clip"><rect x="1" y="1" width="958" height="338" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
