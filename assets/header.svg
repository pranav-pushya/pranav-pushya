<path d="M-122 0H122M0-122V122" stroke="#415073" stroke-opacity=".4"/>
<g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/><circle r="108" fill="none" stroke="#55e5ed" stroke-width="2" stroke-dasharray="85 594"/><circle cx="108" r="4" fill="#55e5ed"/></g>
