<circle r="61" fill="none" stroke="#55e5ed" opacity="0"><animate attributeName="r" values="54;106" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="4s" repeatCount="indefinite"/></circle>
