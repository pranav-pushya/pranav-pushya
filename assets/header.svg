<circle cx="785" cy="160" r="235" fill="url(#halo)"/><path d="M0 1H960" stroke="url(#accent)" stroke-width="3"/>
<g font-family="Segoe UI, Arial, sans-serif">
<circle cx="44" cy="44" r="4" fill="#55e5ed"><animate attributeName="opacity" values="1;.35;1" dur="3s" repeatCount="indefinite"/></circle>
<text x="58" y="48" fill="#97a9c4" font-size="11" letter-spacing="2.4">PRANAV / ENGINEERING LAB</text>
<text x="40" y="122" fill="#f0f5ff" font-size="54" font-weight="700" letter-spacing="-2">Pranav Pushya</text>
<text x="43" y="162" fill="url(#accent)" font-size="25" font-weight="500">Build. Understand. Iterate.</text>
<text x="44" y="201" fill="#aab8ce" font-size="15">Building things I can actually explain, not just ship.</text>
<path d="M44 230H556" stroke="#26344c"/>
<text x="44" y="260" fill="#e1e9f7" font-size="13">CSE · AI/ML @ Chitkara University</text>
<text x="44" y="286" fill="#8d9eb8" font-size="12">COMPUTER VISION / CYBERSECURITY / DEVELOPER TOOLS</text>
</g>
